# Dual-DE transfer (full-space DE + LoRA subspace DE) - CEC f1-f15;
# **additive** subspace assignment. The best subspace direction around the
# full-space best is scaled by transfer_alpha and tested on every full-space
# individual; improved individuals are replaced and transfer success rate is logged.
#
# From repo root:
#   wandb sweep configs/cec2013lsgo/d1000/dual_ea/lora/de_transfer_static.yaml
#   wandb agent <entity>/<project>/<sweep_id>
#
# wandb_name: __auto__ -> scripts/main_dual_ea_transfer.py expands to a unique run name per trial.

name: cec2013-lsgo-dual-de-transfer-lora-d1000
project: evo-subspace-opt
# entity: your-team   # Optional; prefer env WANDB_ENTITY or: wandb sweep -e your-team ...

program: scripts/main_dual_ea_transfer.py
method: grid

metric:
  name: best_fitness
  goal: minimize

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
  - --wandb

parameters:
  wandb_project:
    value: evo-subspace-opt
  wandb_group:
    value: "{problem}-xfer-r{lora_rank}-a{transfer_alpha}"
  wandb_name:
    value: __auto__

  # --- swept ---
  transfer_alpha:
    values:
      - 0.1
      - 0.5
      - 1.0
  lora_rank:
    values:
      - 1
      # - 2
      # - 4
      # - 8
  problem:
    values:
      - cec2013_lsgo_f1
      - cec2013_lsgo_f2
      - cec2013_lsgo_f3
      - cec2013_lsgo_f4
      - cec2013_lsgo_f5
      - cec2013_lsgo_f6
      - cec2013_lsgo_f7
      - cec2013_lsgo_f8
      - cec2013_lsgo_f9
      - cec2013_lsgo_f10
      - cec2013_lsgo_f11
      - cec2013_lsgo_f12
      - cec2013_lsgo_f13
      - cec2013_lsgo_f14
      - cec2013_lsgo_f15
  seed:
    values:
      - 0
      - 1
      - 2

  # --- fixed ---
  subspace_method:
    value: lora
  subspace_assignment:
    value: additive
  fullspace_assignment:
    value: absolute
  sub_anchor_update:
    value: reeval_with_zero_elite
  transfer_every:
    value: 1
  transfer_fraction:
    value: 1.0
  transfer_selection:
    value: random
  transfer_alpha_mode:
    value: fixed
  transfer_success_target:
    value: 0.2
  transfer_alpha_growth:
    value: 1.2
  transfer_alpha_shrink:
    value: 0.7
  transfer_alpha_min:
    value: 0.001
  transfer_alpha_max:
    value: 10.0
  full_iters:
    value: 10
  sub_iters:
    value: 10
  dim:
    value: 1000
  optimizer:
    value: de
  pop_size:
    value: 100
  sub_pop_size:
    value: 100
  init_pop:
    value: uniform
  de_mut_rate:
    value: 0.5
  de_cr_rate:
    value: 0.9
  de_evolving:
    value: false
  de_selection:
    value: rand
  de_n_diffs:
    value: 1
  de_jitter:
    value: false
  de_crossover:
    value: bin
  max_nfe:
    value: 3000000
  log_every:
    value: 1
