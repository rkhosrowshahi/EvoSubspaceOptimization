# Random projection + evosax Open-ES (Adam, lr=0.001) at per-function intrinsic dim.
# ``subspace_dim: intrinsic`` resolves d from results/tables/lsgo/cec2013_intrinsic_dimension.csv.
#
# Open-ES requires even pop_size; uses antithetic sampling by default.
#
# From repo root:
#   wandb sweep configs/cec2013lsgo/d1000/intrinsic_projection/open_es.yaml
#   wandb agent <entity>/evo-subspace-opt/<sweep_id>
#
# Single local run:
#   evo-subspace --problem cec2013_lsgo_f1 --dim 1000 --subspace_method random_projection \
#     --subspace_dim intrinsic --subspace_assignment absolute --optimizer open_es \
#     --es_sigma 0.3 --es_opt adam --es_lr 0.001 --pop_size 24 \
#     --max_nfe 3000000 --seed 0 --subspace_device cuda:0

name: cec2013-lsgo-intrinsic-projection-open-es
project: evo-subspace-opt
# entity: your-team   # Optional; prefer env WANDB_ENTITY or: wandb sweep -e your-team ...

program: scripts/main.py
method: grid

metric:
  name: best_fitness
  goal: minimize

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
  - --wandb

parameters:
  wandb_project:
    value: evo-subspace-opt
  wandb_group:
    value: "{problem}-dim{dim}-{subspace_method}-subdim-intrinsic-{subspace_assignment}-{optimizer}-{es_opt}-lr{es_lr}-sigma{es_sigma}-multiseed"
  wandb_name:
    value: __auto__

  seed:
    values:
      - 0
      - 1
      - 2
  problem:
    values:
      - cec2013_lsgo_f1
      - cec2013_lsgo_f2
      - cec2013_lsgo_f3
      - cec2013_lsgo_f4
      - cec2013_lsgo_f5
      - cec2013_lsgo_f6
      - cec2013_lsgo_f7
      - cec2013_lsgo_f8
      - cec2013_lsgo_f9
      - cec2013_lsgo_f10
      - cec2013_lsgo_f11
      - cec2013_lsgo_f12
      - cec2013_lsgo_f13
      - cec2013_lsgo_f14
      - cec2013_lsgo_f15
  subspace_dim:
    value: intrinsic
  subspace_assignment:
    value: absolute
  subspace_method:
    value: random_projection
  subspace_device:
    value: cuda:0
  dim:
    value: 1000
  optimizer:
    value: open_es
  pop_size:
    value: 24
  es_sigma:
    value: 10
  es_opt:
    value: adam
  es_lr:
    value: 0.001
  max_nfe:
    value: 3000000
  log_every:
    value: 1000
